id: geometry.curvature_segmentation
name: Spatially Regularized Signed-Curvature Mesh Segmentation
domain: geometry
status: reference
paper:
  title: "A New CAD Mesh Segmentation Method, Based on Curvature Tensor Analysis"
  authors: "Guillaume Lavoue, Florent Dupont, and Atilla Baskurt"
  year: 2005
  doi: "10.1016/j.cad.2004.09.001"
  url: "https://doi.org/10.1016/j.cad.2004.09.001"
inputs:
  - "Oriented halfedge triangle mesh with finite positions and face adjacency"
  - "Signed per-vertex principal curvatures k1 and k2, computed by the existing geometry curvature estimator or supplied as slot-aligned arrays"
  - "Fixed component count or bounded automatic model-selection controls, deterministic EM controls, and feature-weighted spatial regularization controls"
  - "For the standalone METHOD-039 evidence stage: shared hard-feature policy/threshold and a dimensionless physical base radius"
outputs:
  - "Slot-aligned face Gaussian-component labels and dual-connected region labels"
  - "Slot-aligned edge region-boundary flags plus deterministic face-region and boundary-edge colors"
  - "Candidate GMM, curvature-fit, spatial-energy, connectivity, cleanup, and failure diagnostics"
  - "Standalone slot-aligned hard/soft feature evidence with per-scale transition/ridge/valley responses, thinning/hysteresis decisions, vertex incidence, work counters, and explicit failure diagnostics"
  - "Unadopted METHOD-039 local-candidate output with provisional/final face regions, seed-growth facts, hard/soft/closure edge roles, regional statistics, exact accepted energy deltas, and explicit failure diagnostics"
backends:
  - cpu_reference
metrics:
  - "quality_error_l2"
  - "quality_error_linf"
  - "fold_boundary_recall"
  - "runtime_ms"
correctness_tests:
  - "../../../tests/unit/geometry/Test.CurvatureSegmentation.cpp"
  - "../../../tests/unit/geometry/Test.CurvaturePatchContract.cpp"
  - "../../../tests/contract/runtime/Test.CurvatureSegmentationOperations.cpp"
  - "../../../tests/integration/runtime/Test.SandboxCurvatureSegmentationPanel.cpp"
benchmarks:
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_smoke.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_100k_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_100k_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_1m_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_1m_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_cold_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_cold_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_reuse_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_profile_10k_reuse_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_remeshing_10k_fixed.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_reference_remeshing_10k_automatic.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_screening_fold_controls.yaml"
  - "../../../benchmarks/geometry/manifests/curvature_segmentation_screening_surface_controls.yaml"
known_limitations:
  - "This is a repository formulation informed by curvature-tensor segmentation, Gaussian mixtures, information criteria, and pairwise spatial models; it is not an equation-level reproduction of Lavoue et al. or another single publication."
  - "Signed principal curvatures depend on a consistent surface-orientation convention and on the scale, noise, and boundary behavior of the upstream curvature estimator."
  - "The existing Gaussian-mixture carrier is three-dimensional, so normalized (k1,k2) samples use a constant zero third coordinate with covariance flooring; automatic selection applies a two-dimensional 6k-1 parameter penalty."
  - "Alternating-order ICM and greedy small-region merging are deterministic local optimizers and do not guarantee the global minimum of the Potts energy."
  - "The reference accepts triangle meshes only and does not repair degeneracies, non-manifold topology, inconsistent orientation, or non-finite inputs."
  - "Published region boundaries are inspection data, not materialized cuts or validated UV-atlas seams; METHOD-039 owns the accepted feature/patch follow-up before GEOM-076 may evaluate any later seam/cut/atlas use."
  - "Only a serial CPU reference backend exists, and the smoke result makes no performance or atlas-quality claim."
  - "METHOD-038 retired at CPUContracted after adding a 10k analytic-sphere cold/reusable descriptor pair, one 10k planar continuous-boundary pair, and independently audited non-claim paired-fold plus cylinder/smooth-transition fixture/oracle lanes. It selected no candidate A-D or v2; broader feature/patch implementation and stability evidence are owned by METHOD-039."
  - "METHOD-039 Slice C implements an unadopted deterministic local grow/merge/refine candidate and passes its bounded oracle and detector controls, but a one-dual-step seed perturbation exceeds the frozen area-weighted VI limit of 0.01. The local candidate is therefore not an accepted v2 backend; no selector, runtime/config/UI adoption, canonical property publication, sealed integrated-quality result, or positive stability claim exists. METHOD-040 owns the separately scoped global multicut attempt."
