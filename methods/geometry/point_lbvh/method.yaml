id: geometry.point_lbvh
name: Point Linear Bounding Volume Hierarchy
domain: geometry
status: reference
paper:
  title: Maximizing Parallelism in the Construction of BVHs, Octrees, and k-d Trees
  authors: Tero Karras
  year: 2012
  doi: "10.2312/EGGH/HPG12/033-037"
  url: "https://research.nvidia.com/publication/2012-06_maximizing-parallelism-construction-bvhs-octrees-and-k-d-trees"
inputs:
  - Finite float3 points on any canonical element domain, in the explicitly chosen index space
  - Batched float3 nearest, k-nearest or inclusive-radius queries with explicit result capacity and optional excluded source ID
outputs:
  - Original element indices and squared Euclidean distances with deterministic index ties
  - Total radius hit counts and invalid-input status; no topology or property mutations
backends:
  - cpu_reference
  - gpu_vulkan_compute
metrics:
  - runtime_ms
  - quality_error_linf
correctness_tests:
  - ../../../tests/unit/geometry/Test.PointConstruction.cpp
  - ../../../tests/contract/runtime/Test.PointConstructionOperations.cpp
  - ../../../tests/integration/graphics/Test.PointConstructionGpuSmoke.cpp
  - ../../../tests/unit/geometry/Test.PointCloudKernels.cpp
  - ../../../tests/contract/runtime/Test.DensityWeightOperations.cpp
  - ../../../tests/unit/geometry/Test.PointLBVH.cpp
  - ../../../tests/contract/runtime/Test.SpatialIndexCache.cpp
  - ../../../tests/contract/runtime/Test.OutlierAnalysis.cpp
  - ../../../tests/contract/runtime/Test.KernelDensityOperations.cpp
  - ../../../tests/unit/geometry/Test.KernelDensity.cpp
  - ../../../tests/unit/geometry/Test.DescriptorAnalysis.cpp
  - ../../../tests/contract/runtime/Test.DescriptorAnalysisOperations.cpp
  - ../../../tests/unit/geometry/Test.KeypointAnalysis.cpp
  - ../../../tests/contract/runtime/Test.KeypointAnalysisOperations.cpp
  - ../../../tests/unit/geometry/Test.BilateralPointFilter.cpp
  - ../../../tests/contract/runtime/Test.BilateralFilterOperations.cpp
  - ../../../tests/integration/graphics/Test.PointLBVHGpuSmoke.cpp
  - ../../../tests/integration/runtime/Test.ClusteringServiceGpuSmoke.cpp
benchmarks:
  - ../../../benchmarks/geometry/manifests/point_lbvh_point_construction_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_lop_vulkan_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_lop_cpu_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_density_weight_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_knn_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_normal_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_outlier_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_density_runtime_smoke.yaml
  - ../../../benchmarks/geometry/manifests/point_lbvh_spacing_runtime_smoke.yaml
