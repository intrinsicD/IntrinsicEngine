known_limitations:
  - Point-neighbor queries only; no triangle distance, ray tracing, arbitrary subset predicates, or refit implementation.
  - CPU indices support at most 2^24 points; GPU supports at most 2^20 points and 2^20 queries per batch.
  - GPU k-nearest supports k=1..64 with capacity equal to k; CPU k=0 returns empty and k>N returns all eligible rows.
  - GPU radius capacity is at most 1024 hits per query; total count exposes overflow, including capacity zero.
  - Coordinates and radii are bounded by 1e18; world-space nearest under nonuniform transforms requires an explicit metric conversion.
  - GPU sorting is bitonic and internal bounds use sorted-range unions; no radix-sort, SAH optimization, or performance improvement is claimed.
  - Standalone GPU views require caller-controlled buffer sizes, submission ordering, and device lifetime.
