id: geometry.coherent_point_drift
name: Coherent Point Drift point-set registration (rigid, affine, nonrigid, Bayesian)
domain: geometry
status: optimized
paper:
  title: "Point Set Registration: Coherent Point Drift"
  authors: Andriy Myronenko and Xubo Song
  year: 2010
  doi: "10.1109/TPAMI.2010.46"
  url: "https://doi.org/10.1109/TPAMI.2010.46"
inputs:
  - Two finite float3 point spans (fixed target, moving source) from any canonical element domain
  - Variant (rigid default, affine, nonrigid, Bayesian), outlier weight w in [0,1), EM limits, sigma^2 floor, nonrigid/Bayesian beta/lambda
  - Bayesian gamma, kappa, source/target subsampling and the optional posterior-variance terms (Hirose 2021)
  - E-step policy (reference, dense, truncated, fast Gauss, auto, Nystrom, Vulkan) with its error tolerance, thread count, nonrigid low rank; the Vulkan policy's device evaluator
outputs:
  - Rigid similarity (rotation, scale, translation) or affine transform, or the nonrigidly displaced source positions
  - Final sigma^2, negative log-likelihood, iterations, termination reason, objective and sigma^2 histories, backend identity
  - Per-iteration E-step policy and error bound, kernel evaluations, low-rank kernel rank and sampled approximation error
backends:
  - cpu_reference
  - cpu_optimized # policies report cpu_dense_parallel, cpu_truncated, cpu_ifgt, cpu_auto or cpu_nystrom
  - gpu_vulkan_compute # METHOD-056 (reports gpu_vulkan_fp32_dense): dense E-step on the device while the kernel is wide (fp32 terms, fp64 sums)
metrics:
  - runtime_ms
  - quality_error_l2
  - quality_error_linf
correctness_tests:
  - ../../../tests/unit/geometry/Test.CoherentPointDrift.cpp
  - ../../../tests/unit/geometry/Test.CoherentPointDriftAccelerated.cpp
  - ../../../tests/unit/geometry/Test.CoherentPointDriftBayesian.cpp
  - ../../../tests/integration/graphics/Test.CoherentPointDriftGpuEStepSmoke.cpp
benchmarks:
  - ../../../benchmarks/geometry/manifests/coherent_point_drift_reference_smoke.yaml
  - ../../../benchmarks/geometry/manifests/coherent_point_drift_accelerated_smoke.yaml
  - ../../../benchmarks/geometry/manifests/coherent_point_drift_accelerated.yaml
  - ../../../benchmarks/geometry/manifests/coherent_point_drift_gpu_vulkan_smoke.yaml
  - ../../../benchmarks/geometry/manifests/coherent_point_drift_gpu_vulkan_scaling.yaml
known_limitations:
  - The reference E-step is O(N*M) per iteration; the dense parallel policy keeps that cost, the truncated policy reaches it only while sigma is wide, and the fast Gauss transform does not beat dense in 3-D at tight tolerances.
  - The Nystrom E-step (METHOD-053) is approximate with an a-posteriori sampled error estimate, not a bound; iterations above NystromErrorLimit run exactly.
  - The Vulkan E-step (METHOD-056) evaluates kernel terms in fp32 (a first-order estimate, not a rigorous bound, routes iterations above 2e-5 to the CPU and is reported as the error bound; frozen smoke tolerance 1e-5 relative), is deterministic on one device and driver but not bitwise across vendors, needs shader float64, and pays two to six frames of latency per iteration because results are read back through the frame loop.
  - The full-kernel nonrigid solve is O(M^3) per iteration and limited to 8192 source points; the low-rank solve (k eigenpairs, Nystroem) allows 1,000,000 with an approximation error reported, not bounded.
  - Bayesian: the similarity/deformation split is not identifiable under weak priors; posterior-variance terms can collapse the scale and are off by default; sparse subsamples keep shape, not correspondences.
  - EM is local; large rotations, symmetric shapes and reflections need a nearby start (see paper.md).
  - Beta, lambda and the sigma^2 values are dimensionless under the default input normalization.
