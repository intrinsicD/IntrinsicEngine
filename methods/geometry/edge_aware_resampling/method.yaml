id: geometry.edge_aware_resampling
name: Edge-Aware Point Set Resampling
domain: geometry
status: reference
paper:
  title: "Edge-Aware Point Set Resampling"
  authors: "Hui Huang, Shihao Wu, Minglun Gong, Daniel Cohen-Or, Uri Ascher, Hao Zhang"
  year: 2013
  doi: "10.1145/2421636.2421645"
  url: "https://doi.org/10.1145/2421636.2421645"
inputs:
  - "Finite point positions with at least two samples"
  - "Valid authored oriented normals or deterministic PCA plus MST estimation"
  - "EarStrategy or anisotropic WlopStrategy with world-unit support, normal-angle, iteration, count, seed, and resource controls"
outputs:
  - "Projected/resampled point positions and oriented normals"
  - "CPU-reference diagnostics for normal source/refinement, anisotropic projection, insertion, convergence, and failures"
backends:
  - cpu_reference
metrics:
  - "edge_sharpness_preservation"
  - "mean_distance_to_reference_surface"
  - "uniformity_min_pairwise_distance"
  - "normal_angular_error"
  - "iterations"
  - "runtime_ms"
correctness_tests:
  - "../../../tests/unit/geometry/Test.PointCloudConsolidation.cpp"
  - "../../../tests/unit/geometry/Test.PointCloudKernels.cpp"
benchmarks:
  - "../../../benchmarks/geometry/manifests/edge_aware_resampling_reference_smoke.yaml"
  - "../../../benchmarks/geometry/manifests/lop_family_comparison_smoke.yaml"
known_limitations:
  - "The original fixed support and normal-angle controls require scale/noise-aware tuning and do not handle open boundaries explicitly."
  - "Severe noise, under-sampling, close sheets, or erroneous normal orientation can over-smooth or over-sharpen features."
  - "The deterministic CPU reference implements original EAR, not later L0, graph/intrinsic, or learned resampling objectives."
  - "The serial CPU reference is correctness-oriented and makes no performance claim."
  - "METHOD-019's exact optimized EAR candidate preserved parity but missed the frozen useful-acceleration gate; no optimized backend is selectable."
