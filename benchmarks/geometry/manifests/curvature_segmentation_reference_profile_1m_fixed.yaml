benchmark_id: geometry.curvature_segmentation.reference.profile.1m.fixed
method: geometry.curvature_segmentation
dataset: builtin.curvature_regime_grid_pair.v1
params:
  intent: heavy_baseline_profile
  backend: cpu_reference_v1
  descriptor_lane: supplied_curvature
  component_selection: fixed
  component_count: 2
  live_faces: 1000000
  triangulations: [uniform, anisotropic_nonuniform]
  aggregation: max_of_variant_medians
  threshold_scope: harness_health_not_acceleration
  warmup_iterations: 0
  measured_iterations: 1
  quality_error_l2_unit: misclassified_face_fraction
metrics: [runtime_ms, memory_peak_bytes, quality_error_l2, population_count]
thresholds:
  runner_health_runtime_ms_max: 180000
  memory_peak_bytes_max: 17179869184
  quality_error_l2_max: 0.02
  population_count_min: 2
  population_count_max: 2
