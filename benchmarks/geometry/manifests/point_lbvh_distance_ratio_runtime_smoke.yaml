benchmark_id: geometry.point_lbvh.distance_ratio_runtime_smoke
method: geometry.point_lbvh
dataset: builtin.outlier_clusters.eight_domains.seed241
params:
  intent: smoke
  warmup_iterations: 1
  measured_iterations: 1
  capability: gpu_vulkan
  k_neighbors: 8
  score_threshold: 2
  gpu_query_batch_size: 64
  timed_scope: eight_domain_distance_ratio_requests_through_publication
metrics:
  - runtime_ms
  - quality_error_linf
thresholds:
  smoke_runtime_ms_max: 15000
  quality_error_linf_max: 0.00001
