# METHOD-019 — frozen LOP-family reference/optimized CPU comparison.
benchmark_id: geometry.lop_family.comparison.smoke
method: geometry.lop_family.backend_comparison
dataset: builtin.lop_family.comparison.v1
params:
  intent: performance
  fixture_version: 1
  baseline_backend: cpu_reference
  probe_backend: cpu_optimized_candidate
  strategies:
    - lop
    - wlop
    - clop
    - ear
  fixtures:
    lop:
      id: deterministic_noisy_plane_32x32
      input_points: 1024
      target_points: 256
      support_radius: 0.18
      repulsion_weight: 0.35
      projection_iterations: 8
      seed: 1901
    wlop:
      id: deterministic_density_plane_40x24
      input_points: 960
      target_points: 240
      support_radius: 0.20
      repulsion_weight: 0.35
      projection_iterations: 8
      seed: 1902
    clop:
      id: deterministic_noisy_plane_30x24
      input_points: 720
      target_points: 240
      support_radius: 0.22
      repulsion_weight: 0.35
      projection_iterations: 6
      mixture_components: 24
      mixture_iterations: 40
      mixture_relative_tolerance: 0.00001
      covariance_floor: 0.000001
      seed: 1903
    ear:
      id: deterministic_oriented_dihedral_8x7x2
      input_points: 112
      target_points: 120
      support_radius: 0.52
      repulsion_weight: 0.10
      normal_angle_degrees: 15
      normal_refinement_rounds: 3
      edge_sensitivity: 5
      seed: 1904
  warmup_pairs: 1
  measured_pairs: 5
  timing_statistic: median_paired_runtime_ratio
  backend_runtime_statistic: median_individual_runtime_ms
  measurement_order: alternating_reference_optimized_optimized_reference
  useful_runtime_ratio_max: 0.80
  position_rms_delta_max: 0.000001
  position_linf_delta_max: 0.000002
  normal_rms_delta_max: 0.000001
  normal_linf_delta_max: 0.000002
metrics:
  - runtime_ms
  - quality_error_l2
thresholds:
  smoke_runtime_ms_max: 30000
  quality_error_l2_max: 0.000001
