benchmark_id: runtime.sparse_cg.vulkan_parity
method: geometry.sparse_cg
dataset: builtin.sparse_cg.consumer_systems.seed269
params:
  intent: correctness
  capability: shader_float64
  backend: vulkan_compute
  preconditioner: jacobi
  systems: [heat_step, regularized_poisson, implicit_three_warm_starts, implicit_chained_steps, max_iterations, breakdown_zero_matrix, non_finite]
  heat_grid: 18x18
  graph_rows: 300
  tolerance: 1.0e-8
  max_iterations: 2000
  chunk_dispatches: 2048
  warmup_iterations: 0
  measured_iterations: 1
  # Status and iteration count must match the CPU oracle (gap <= 2); converged well-conditioned
  # solutions within 1e-6 relative; every converged device solution meets the CPU stopping rule.
metrics:
  - runtime_ms
  - quality_error_linf
thresholds:
  quality_error_linf_max: 1.0e-6
