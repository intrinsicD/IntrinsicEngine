benchmark_id: geometry.geodesics_virtual_source.smoke
method: geometry.geodesics_virtual_source
dataset: builtin.flat_grid.corner_source.8
params:
  intent: smoke
  grid_columns: 8
  source_vertices: [0]
  max_halfedge_expansions: 10000000
  warmup_iterations: 1
