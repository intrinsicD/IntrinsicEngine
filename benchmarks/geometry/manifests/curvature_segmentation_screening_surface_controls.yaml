benchmark_id: geometry.curvature_segmentation.screening.surface_controls
method: geometry.curvature_segmentation
dataset: builtin.cylinder_smooth_transition_pair.v1
params:
  intent: slice_a_contract_control
  implementation: cpu_reference_v1_plus_geometry_feature_classifier
  candidate_selection: none
  warmup_iterations: 0
  measured_iterations: 1
  split: screening
  claim_scope: fixture_integrity_only
  dihedral_threshold_degrees: 45.0
  threshold_comparison: strictly_greater
  boundary_is_feature: false
  cylinder:
    radius: 1.0
    length: 2.0
    axial_cells: 32
    angular_cells: 64
    angular_phase_turns: [0.0, 0.0078125]
    supplied_principal_curvatures: [1.0, 0.0]
    expected_v1_components: 1
    expected_v1_regions: 1
    expected_v1_boundaries: 0
    seed: 1709
  smooth_transition:
    graph: "z = q(x), q(x) = 0.5 * (1 + tanh(x / 0.08))"
    domain_x: [-1.0, 1.0]
    domain_y: [0.0, 1.0]
    rows: 24
    columns: 48
    triangulations: [diagonal_a, diagonal_b]
    supplied_principal_curvature: "q''(x) / (1 + q'(x)^2)^(3/2)"
    reference_curve: "x = 0, z = 0.5, y in [0,1]"
    normalized_boundary_tolerance: 0.02
    expected_v1_components: 2
    expected_v1_regions: 2
    seed: 1741
  quality_error_l2_unit: maximum_control_fraction
  quality_error_linf_unit: maximum_bbox_normalized_geometric_or_boundary_error
metrics: [runtime_ms, memory_peak_bytes, quality_error_l2, quality_error_linf, population_count]
thresholds:
  fixture_runtime_ms_max: 2000
  memory_peak_bytes_max: 2147483648
  quality_error_l2_max: 0.02
  quality_error_linf_max: 0.02
  population_count_min: 4
  population_count_max: 4
