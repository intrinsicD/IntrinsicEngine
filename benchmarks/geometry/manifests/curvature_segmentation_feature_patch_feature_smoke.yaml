benchmark_id: geometry.curvature_segmentation.feature_patch.feature_smoke
method: geometry.curvature_segmentation
dataset: builtin.method_039.smooth_transition_diagonal_pair.v1
params:
  intent: correctness_smoke
  implementation: method_039_feature_evidence_unadopted
  candidate_adopted: false
  split: generated_screening
  triangulations: [diagonal_a, diagonal_b]
  feature_evidence: computed
  base_radius_ratio: 0.02
  hard_dihedral_threshold_degrees: 45.0
  expected_soft_edges_per_variant: 24
  expected_endpoints_per_variant: 2
  expected_junctions_per_variant: 0
  baseline: exact_smooth_transition_feature_line
  aggregation: max_of_diagonal_pair
  warmup_iterations: 0
  measured_iterations: 1
  threshold_scope: bounded_correctness_not_performance
  quality_error_l2_unit: maximum_live_edge_feature_mask_mismatch_fraction
  quality_error_linf_unit: maximum_bbox_normalized_boundary_distance_upper_bound
metrics: [runtime_ms, memory_peak_bytes, quality_error_l2, quality_error_linf, population_count]
thresholds:
  smoke_runtime_ms_max: 20000
  memory_peak_bytes_max: 2147483648
  quality_error_l2_max: 0.0
  quality_error_linf_max: 0.02
  population_count_min: 2
  population_count_max: 2
