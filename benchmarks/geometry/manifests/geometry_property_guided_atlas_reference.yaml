benchmark_id: geometry.uv_atlas.property_guided.reference
method: geometry.uv_atlas.property_guided
dataset: repository.method045_frozen_surfaces_and_procedural_controls
params:
  intent: correctness
  cohort: [sculpt, frog, fandisk, dolphin]
  controls: [planar_grid, folded_grid, disconnected_triangles]
  methods: [fast-staged, xatlas]
  objectives: [none, angle, area, both]
  xatlas_objectives: [angle]
  guide: frozen_connected_scalar_regions
  resolution: 1024
  padding: 2
  max_conformal_distortion: 10.0
  max_area_distortion: 10.0
  max_charts: 16384
  max_iterations: 40
  warmup_iterations: 0
  measured_iterations: 1
  scope: explicit_correctness_diagnostic_not_default_smoke
  timing_claim: false
  baseline: xatlas_angle_same_source_and_regions
metrics: [quality_error_linf, runtime_ms]
thresholds:
  quality_error_linf_max: 0.0
