benchmark_id: geometry.curvature_segmentation.local_mesh.local_cohort
method: geometry.curvature_segmentation
dataset: local.method_040.mesh_cohort.v1
params:
  intent: nightly
  implementation: method_039_local_patch_unadopted
  candidate_adopted: false
  base_radius_ratio: 0.02
  seed_spacing_multiplier: 2
  curvature_transition_weight: 1
  soft_feature_transition_weight: 4
  patch_complexity_cost: 0.5
  boundary_length_weight: 0.01
  boundary_turn_weight: 0.001
  boundary_feature_weight: 0.02
  maximum_refinement_sweeps: 8
  mixture:
    selection: automatic
    fixed_component_count: 6
    automatic_min_components: 1
    automatic_max_components: 12
    automatic_fit_tolerance: 0.35
    automatic_complexity_weight: 1
    max_em_iterations: 100
    em_relative_tolerance: 1.0e-06
    covariance_floor: 1.0e-05
    seed: 42
    unused_fields: Potts spatial and cleanup controls are not consumed by METHOD-039
  detector: method_039_defaults
  cohort:
  - sculpt
  - frog
  - fandisk
  - bunny10k
  - dolphin
  - elephant
  - bumpy_torus
  - genus3
  - office_chair
  - sphere
  - cube
  - saddle2
  inputs: external_local_read_only_obj
  warmup_iterations: 0
  measured_iterations: 1
  aggregation: per_mesh
  quality_error_l2_unit: unassigned_face_fraction
  quality_error_linf_unit: hard_constraint_violation_count
  threshold_scope: correctness_and_bounded_health_not_segmentation_quality
metrics:
- runtime_ms
- memory_peak_bytes
- quality_error_l2
- quality_error_linf
- population_count
thresholds:
  runtime_ms_max: 300000
  memory_peak_bytes_max: 2147483648
  quality_error_l2_max: 0
  quality_error_linf_max: 0
  population_count_min: 1
