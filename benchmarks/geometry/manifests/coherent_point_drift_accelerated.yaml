# METHOD-049 - optimized Coherent Point Drift backends against the METHOD-015 reference.
#
# Opt-in scaling profile (IntrinsicCoherentPointDriftScaling on the ci-release preset); not
# a default CTest. Timings are same-host evidence, not a cross-host guarantee. Parity is the
# max registered-point difference to the reference; above the reference cap it is measured
# against the dense-parallel run, whose own parity is proven at the smaller sizes.
benchmark_id: geometry.coherent_point_drift.accelerated
method: geometry.coherent_point_drift
dataset: builtin.cpd_bumpy_ellipsoid_scaling.v1
params:
  intent: performance_scaling_profile
  runner: IntrinsicCoherentPointDriftScaling
  build_preset: ci-release
  sizes: [1000, 10000, 100000]
  fixture: bumpy ellipsoid surface samples; target rotated 0.35 rad, translated, noise 0.004, 5% uniform clutter
  rigid_runs: [reference, truncated and fast_gauss (<= 10000 points), dense, auto]
  nonrigid_runs: [full kernel with auto E-step (<= 2000 points), low rank 50 and 150 with auto E-step]
  nonrigid_max_iterations: 150
  e_step_tolerance: 1.0e-6
  outlier_weight: 0.05
  threads: all hardware threads
  timing_statistic: single_run_wall_clock
  evidence: ara/evidence/diagnostics/method049_cpd_accelerated/
metrics: [runtime_ms, quality_error_l2, quality_error_linf]
thresholds:
  # quality_error_l2: RMS distance of the registered source to its ground-truth image.
  quality_error_l2_max: 0.001
  # quality_error_linf: max point difference of any rigid policy to its oracle (bounded policies at tol 1e-6).
  quality_error_linf_max: 1.0e-4
