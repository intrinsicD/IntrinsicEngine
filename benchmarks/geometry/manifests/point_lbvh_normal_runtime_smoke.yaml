benchmark_id: geometry.point_lbvh.normal_runtime_smoke
method: geometry.point_lbvh
dataset: builtin.paraboloid.66_slots.eight_domains.seed241
params:
  intent: smoke
  warmup_iterations: 1
  measured_iterations: 1
  capability: gpu_vulkan
  k_neighbors: 15
  radius: 1.1
  gpu_query_batch_size: 64
  timed_scope: eight_domain_normal_requests_through_publication
metrics:
  - runtime_ms
  - quality_error_linf
thresholds:
  smoke_runtime_ms_max: 15000
  quality_error_linf_max: 0.00001
