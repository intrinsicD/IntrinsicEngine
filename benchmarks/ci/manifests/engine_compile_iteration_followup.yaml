benchmark_id: build.engine_compile_iteration.followup.v1
method: build.engine_compile_iteration
dataset: intrinsicengine.source.compile_followup_2026_09_15
params:
  intent: performance
  source_revisions:
    before: 07a8b29147ccd642fcf827c6a6361ba3e1c29f13
    after: 45d5a4f1fc0c7e51172a0e4a0edbca2f675448ea
  sample_order:
  - before
  - after
  - after
  - before
  - before
  - after
  measured_iterations: 3
  warmup_iterations: 0
  warmup_scope: No discarded pilots; identical source/dependency input pre-read before every measured
    sample. Existing protocol establishes resource requirements.
  preset: ci
  target: ExtrinsicRuntime
  compiler: /usr/bin/clang++-23
  jobs: 4
  minimum_interface_importers: 1
  configure_options:
  - -DEXTRINSIC_BACKEND=Null
  - -DINTRINSIC_PLATFORM_BACKEND=Null
  - -DINTRINSIC_HEADLESS_NO_GLFW=ON
  - -DINTRINSIC_BUILD_TESTS=OFF
  - -DINTRINSIC_BUILD_BENCHMARKS=OFF
  - -DINTRINSIC_ENABLE_CCACHE=OFF
  - -DCMAKE_CXX_COMPILER_LAUNCHER=
  - -DCMAKE_C_COMPILER_LAUNCHER=
  - -DVCPKG_MANIFEST_INSTALL=OFF
  - -DCMAKE_C_COMPILER=/usr/bin/clang-23
  - -DCMAKE_CXX_COMPILER=/usr/bin/clang++-23
  - -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/bin/clang-scan-deps-23
  scenarios:
    clean: null
    noop: null
    workspace_impl: src/runtime/Editor/Runtime.EditorWorkspaceSnapshots.Models.cpp
    renderer_impl: src/graphics/renderer/Graphics.Renderer.cpp
    config_impl: src/runtime/Modules/PointCloudConsolidation/Runtime.PointCloudConsolidationConfig.cpp
    config_interface: src/runtime/Modules/PointCloudConsolidation/Runtime.PointCloudConsolidationConfig.cppm
    snapshot_interface: src/runtime/Editor/Runtime.EditorWorkspaceSnapshots.cppm
    renderer_interface: src/graphics/renderer/Graphics.Renderer.cppm
  invalidation: mtime only; source bytes remain at the exact clean commit; require observed importer fan-out
  build_storage: One disposable tmpfs build at /dev/shm/intrinsic-build009; disk-backed disposable source
    worktree at /tmp/intrinsic-build009/source; record available tmpfs/disk/host memory. No process-RSS
    attribution to tmpfs pages.
  dependency_state: identical preinstalled vcpkg packages, no package installation during sampling
  operating_system_cache: input pre-read, no cache flushing, no cold-filesystem claim
  memory_measurement: GNU time maximum single-process RSS, not aggregate concurrent memory
  critical_path: Ninja target DAG weighted by unfiltered per-invocation timings; unmatched meta-edges
    reported
  summary: Per-scenario descriptive median and min/max from three samples per arm, all raw values and
    negative outcomes retained; no statistical or cross-host guarantee. Engine-library target excludes
    tests, Sandbox and GPU execution.
  sample_sequence: Configure, clean, no-op, three implementation edits, config interface, snapshot interface,
    renderer interface; source bytes unchanged and tree retained within each sample. Recreate owned build
    tree between samples.
  noise_scope: Normal desktop host; no CPU affinity/governor/turbo control. No competing compilation or
    tests; source inspection and remote review may run. Local descriptive comparison, not an isolated-machine
    or statistical claim.
  configure_measurement: initial configure only; source iteration cohort deliberately excludes the already-measured
    reconfigure scenario.
metrics:
- build_time_ms
- configure_time_ms
- memory_peak_bytes
- sample_count
thresholds: {}
