benchmark_id: runtime.method_execution.queries
method: runtime.method_execution.queries
dataset: builtin.seeded_cloud_duplicate_ties
params:
  intent: performance
  runner: IntrinsicMethodExecutionMeasurement
  seeds: [11, 23, 37, 53, 71]
  point_counts: [4096, 32768]
  strategies: [brute_force, lbvh]
  queues: [separate]
  queries: 256
  k: 16
  page_queries: 16
  warmup_iterations: 1
  measured_iterations: 3
  repeat_policy: one_cold_then_three_warm_sweeps_shared_session
  independent_units: seeds
  process_timeout_seconds: 10
  rendered_load: reference_triangle_640x480_no_vsync
  quality: exact_original_ids_ties_exclusions_squared_distance_absolute_1e-5
  memory_scope: readback_ring_staging_high_water_bytes_not_total_device_memory
metrics: [runtime_ms, throughput_items_per_sec, memory_peak_bytes, quality_error_linf, sample_count, avgFrameTimeMs, p99FrameTimeMs, totalFrames]
thresholds:
  quality_error_linf_max: 1.0e-5
  sample_count_min: 20
