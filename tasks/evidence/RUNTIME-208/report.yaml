changed_public_contracts:
- Progressive Poisson consumes canonical mesh, graph, or point-cloud Vertices directly and publishes source-cardinality
  v:poisson_level, v:poisson_rank, v:poisson_splat_radius, and v:poisson_prefix_visible without domain
  replacement or topology mutation.
- The playground channel token is Rank; the obsolete Phase token and mesh-surface-generation fields are
  rejected/diagnosed and omitted from canonical serialization.
- Queued publication and history value-compare production typed mesh/graph connectivity and reject unrecognized
  erased properties rather than overwriting an unverified snapshot.
diagnostics_and_previews:
- Unknown removed mesh-surface fields produce UnknownField diagnostics; obsolete Phase produces InvalidValue
  and falls back to the supplied per-field reference value before canonical serialization (Rank in the
  migration regression).
- Requested gpu_vulkan_compute remains an explicit reported CPU-reference fallback until METHOD-014 closes
  operational compute parity.
