changed_public_contracts:
- A gpu_vulkan_compute request executes actual Vulkan only on an operational device; otherwise it reports
  cpu_reference plus FellBackToCPU without claiming GPU execution.
- Ordinary LOP and isotropic WLOP are the only adopted Vulkan pairs; anisotropic WLOP, CLOP, and EAR fail
  shared preview as capability-negative.
- GPU completion publishes through the same generation/staleness, undo, property/topology, and render-dirty
  path as CPU consolidation.
diagnostics_and_previews:
- Claim-grade v4/run-002 completed eight Vulkan requests on the recorded RTX 3050 with zero fallback;
  worst RMS 1.6746e-5 and L-infinity 1.31344e-4 passed frozen bounds.
- V3/run-001 remains independently rejected because its pre-BUG-129 unavailable runner could exit zero;
  corrected run-002 is separately accepted.
benchmark_or_parity_evidence:
- geometry.lop_family.gpu_vulkan.v3.smoke binds the same-fixture CPU reference, actual device/backend
  identity, one warmup plus three measured iterations, and explicitly sets speedup_claimed=false.
