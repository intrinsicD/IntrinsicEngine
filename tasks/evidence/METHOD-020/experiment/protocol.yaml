  operator: <=
  threshold: 0.0005
- metric: maximum_combined_linf_error
  operator: <=
  threshold: 0.002
screening_confirmation_policy: 'V1 and v2 were frozen and rejected when their CPU WLOP oracles produced
  no positions. V3 support-radius screening and the implementation candidate were committed before this
  official confirmation. The benchmark exits nonzero unless every run reports actual gpu_vulkan_compute,
  no fallback, matched status/cardinality/iterations/convergence, bounded CPU parity, and bounded same-host
  repeatability. A miss remains negative evidence and prevents backend promotion for that strategy.

  '
