protocol_id: lop-family-vulkan-parity-v3
profile: claim-grade
state: frozen
question: 'Do the production ordinary-LOP and isotropic-WLOP Vulkan paths preserve the frozen v3 CPU-reference
  result and same-host repeatability contracts without falling back from actual Vulkan execution?

  '
hypothesis: 'Both adopted Vulkan paths complete all eight measured GPU requests with no fallback, match
  CPU-reference status, cardinality, iteration count, and convergence state, and keep worst positional
  RMS and L-infinity error across CPU parity and same-host repeats at or below 0.0005 and 0.002 respectively.

  '
claim_boundary: 'The two checked-in analytic v3 fixtures on the recorded local Vulkan device and exact
  source revision only. This protocol makes no scanner-corpus, cross-device, asymptotic, memory-efficiency,
  device-time, or speedup claim; anisotropic WLOP, CLOP, and EAR remain capability-negative backend pairs.

  '
evidence_phase: confirmation
claim_eligible: true
datasets:
