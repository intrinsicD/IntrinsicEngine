disjoint_splits:
- left: screening
  right: confirmation
  method: 'Screening contains CPU-only support-radius feasibility observations and no Vulkan output. Confirmation
    consumes the preregistered h=0.32 choice and records previously unobserved actual-Vulkan parity/repeat
    outputs. The analytic WLOP coordinates are intentionally shared because the claim is implementation
    parity on that frozen fixture, not sample generalization; evidence channels and backend outcomes are
    disjoint.

    '
seeds:
- 1901
- 1902
input_policy: 'Use only the committed v3 analytic fixtures, parameters, seeds, one warmup, three measured
  runs, and frozen tolerances. Earlier v1/v2 failures remain visible negative screening evidence. Do not
  retune radius, fixture, iteration budget, tolerance, backend identity, or fallback policy after observing
  Vulkan results.

  '
