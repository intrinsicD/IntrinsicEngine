changed_public_contracts:
- AGENTS.md now requires task authors and implementers to discover, declare, preserve, and dispose every
  applicable catalog contract; task wording cannot silently narrow canonical semantics
- Every new or materially changed task in active, backlog, done, or archive uses contract_schema 1 with
  unique known contract IDs or a justified empty review; only exact unconsumed snapshots at the immutable
  pre-policy revision are grandfathered
- Method-backed tasks dispose the least-structured input, compatible ECS sources, RuntimeModule, config/agent,
  UI, publication, and end-to-end-test matrix and review original papers plus relevant extensions and
  improvements
- The target ECS element-domain matrix is Vertices for point cloud/graph/mesh, Halfedges and Edges for
  graph/mesh, and Faces for mesh; HARDEN-087 owns the documented current graph storage mismatch
diagnostics_and_previews:
- Focused task-validator regressions pass 21/21; strict validation accepts 191 task files with zero findings,
  including lifecycle and consumed-snapshot negative coverage
- Clang aggregate IntrinsicTests build passed and the default CPU selector passed 3,991/3,991 selected
  tests on revision one; revision-two repairs touch only Python task tooling, policy, evidence, and literature
  metadata
- Strict task policy/state, skill mirror, documentation-link, ARA, root-hygiene, Python compile, and post-commit
  docs-sync gates pass on revision two
- The scoped source and stable-reference bibliographic audit found one physical ECS source drift and five
  method-integration gaps, each assigned to a bounded dependency-linked ECS/runtime/UI task chain
