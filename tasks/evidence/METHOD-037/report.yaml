residual_risks:
- The CPU reference uses deterministic local ICM and greedy cleanup, not a global optimizer; MinimumRegionFaces
  > 1 lacks a deterministic assertion.
- The tiny folded-strip smoke does not establish remeshing stability, feature-curve quality, atlas suitability,
  or useful acceleration; quality_error_l2 is a misclassification fraction, not Euclidean L2.
- Promoted Vulkan remained non-operational after barrier validation during the editor run; BUG-118 owns
  the observed LeakSanitizer shutdown hang.
- The first scratch custody run and failed ARA proof-path receipt are transparently retained as superseded;
  neither is canonical completion evidence.
- The sculpt visual proof is a manual hash-bound screenshot rather than an automated golden/readback.
