changed_public_contracts:
- CotanSmoothVertexProperty supports float, double, and glm::vec2/vec3/vec4 vertex properties with simultaneous
  damped nonnegative-cotan updates, optional active support, and fail-before-mutation validation
- Principal curvature follows the selected PMP signed 3x3, interior-support, boundary-interpolation, and
  three-pass smoothing formulation with explicit finite support diagnostics
- OBJ authored normal discontinuities publish as h:normal and affect only runtime GPU shading-tuple expansion,
  never authoritative owning topology
diagnostics_and_previews:
- 96-model deterministic corpus sample compared 80 payload-bearing models and 2,530,726 vertices; clean-support
  median relative L2 was approximately 4e-8 and all material outliers localized to rejected degenerate
  or ill-conditioned support
- Final CPU passed 4252/4252; isolated ASan and UBSan each passed 2744/2744; task-specific promoted-Vulkan
  normal-path cases passed 2/2
- The complete promoted-Vulkan cohort passed once, then two repeats failed only the unrelated native-timestamp
  zero-duration assertion; BUG-155 preserves the failure and owns diagnosis
benchmark_or_parity_evidence:
- Pinned local PMP revision and matched Clang 23 probes establish numerical parity; four-model timings
  are explicitly machine-local non-claim evidence
