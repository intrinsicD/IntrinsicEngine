changed_public_contracts:
- CotanSmoothVertexProperty supports float, double, and glm::vec2/vec3/vec4 vertex properties with simultaneous
  damped nonnegative-cotan updates, optional active support, and fail-before-mutation validation
- Principal curvature on the reviewed BUG-154 slice follows the selected PMP signed 3x3, interior-support,
  boundary-interpolation, and three-pass smoothing formulation with explicit finite support diagnostics;
  BUG-156 supersedes the shipped estimator selection
- OBJ authored normal discontinuities publish as h:normal and affect only runtime GPU shading-tuple expansion,
  never authoritative owning topology
diagnostics_and_previews:
- The retained 96-model diagnostic compared 80 payload-bearing models and 2,530,726 vertices; its machine-local
  timing remains non-claim evidence
- Retained receipts cover CPU 4252/4252, isolated ASan and UBSan 2744/2744, focused geometry/runtime selectors,
  task-specific Vulkan readback, strict structural gates, and prior accepted independent review rounds
- The first 2026-09-03 unqualified multi-ICD retirement cohort passed 53/54 and failed only on BUG-118
  external shutdown allocations; that receipt is preserved as optional diagnostic evidence
- After BUG-118 bounded the affected-libX11 XIM row and the local run selected its operational NVIDIA
  ICD, the complete current promoted-Vulkan cohort passed 54/54 in 478.18 seconds without retries or broad
  suppressions
benchmark_or_parity_evidence:
- Pinned local PMP revision and matched Clang 23 probes establish the bounded numerical comparison; four-model
  timings are explicitly machine-local non-claim evidence
