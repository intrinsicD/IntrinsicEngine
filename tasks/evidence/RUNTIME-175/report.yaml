changed_public_contracts:
- Extrinsic.Runtime.PointCloudConsolidationConfig owns the versioned sandbox.point_cloud_consolidation
  schema, stable strategy/normal tokens, validator, serializer, and generic engine-config registration
  factory.
- PointCloudConsolidationService and PointCloudConsolidationModule expose queued CPU-reference submission,
  completion subscription, and pointer-free results without an RHI or speculative backend axis.
- EditorGeometryProcessingPreparedFrame and SandboxEditorContext carry exact config/service availability
  and copied last-result state into the app-owned panel.
diagnostics_and_previews:
- Completion reports world/entity/source staleness, actual cpu_reference implementation and strategy identity,
  counts, convergence/displacement, normal provenance/refinement, insertions, and failure text.
- Focused contracts cover config round-trip/fallback, undo/redo publication, stale queued writeback, runtime
  determinism, Editor/AgentCli/Programmatic source parity, and UI-prepared workspace execution.
- The complete default CPU selector passed 4,044/4,044 with the expected GLFW/LSan self-skip; the four
  focused runtime contracts also passed under ci-vulkan combined ASan/UBSan instrumentation.
