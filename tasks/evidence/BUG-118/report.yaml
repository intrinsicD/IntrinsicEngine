changed_public_contracts:
- The standalone GLFW and Vulkan shutdown proofs admit only the exact affected-libX11 _XimRegisterIMInstantiateCallback
  retention while still requiring the named 4096-byte engine allocation to fail under LeakSanitizer
diagnostics_and_previews:
- A fresh Clang 23 ASan helper reproduced one 408-byte _XimRegisterIMInstantiateCallback retention after
  terminate_calls=1; libX11 1.7.5-1ubuntu0.3 predates upstream fix 1d118226, while BUG-082 evidence used
  fixed libX11 1.8.7
- Changing XMODIFIERS and GTK/QT input-method variables did not alter the 408-byte finding, rejecting
  input-method selection as the remedy
- The direct clean helper used exactly one 408-byte suppression and proved one glfwTerminate call; ten
  contract iterations each preserved the independent 4096-byte LeakSanitizer exit-86 control
- Runtime maps bound the initial two 256-byte shutdown rows to installed but non-selected lavapipe and
  Radeon ICDs; selecting the operational NVIDIA ICD made the exact shutdown proof pass without a loader
  or driver suppression
- 'Current gates pass: ASan standalone 10/10, GLFW/platform 2/2, CPU 4258/4258 with one designed unsanitized
  capability skip, exact Vulkan pair 2/2, and full selected-ICD promoted Vulkan 54/54'
