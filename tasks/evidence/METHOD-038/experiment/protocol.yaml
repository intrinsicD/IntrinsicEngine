seeds:
- 1709
- 1741
input_policy: Use only the committed cylinder and smooth-transition generators, declared phase/diagonal
  pairs, exact mesh resolutions and analytic equations, strict greater-than 45-degree classifier with
  boundary_is_feature false, fixed one/two-component cpu_reference_v1 parameters, and the frozen manifest
  gates. Preserve every observed failure; do not retune the surface width, phases, threshold, resolution,
  supplied curvature, reference curve, segmentation parameters, or gates from this run. Confirmation parameters
  remain unread.
comparators:
- id: cylinder-phase-0-versus-phase-1-over-128-turn
  budget: identical radius, length, resolution, periodic topology, supplied curvature, classifier parameters,
    fixed-one v1 parameters, and serial CPU backend
- id: smooth-diagonal-a-versus-diagonal-b
  budget: identical graph surface, parametric samples, analytic curvature, reference curve, classifier
    parameters, fixed-two v1 parameters, and serial CPU backend
