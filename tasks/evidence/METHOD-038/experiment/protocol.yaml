schema_version: 2
task_id: METHOD-038
protocol_id: curvature-segmentation-surface-controls-scratch-v1
profile: claim-grade
state: frozen
question: Does the preregistered paired open-cylinder and smooth generalized-cylinder control lane preserve
  its analytic geometry, orientation, hard-feature, unchanged-v1, and exact continuous-reference-curve
  oracles?
hypothesis: Both cylinder phases have outward orientation, at most 1e-6 bbox-normalized radial and paired-edge-length
  error, zero hard-feature edges, one v1 component, one connected region, zero v1 boundaries, and identical
  v1 payloads. Both smooth diagonal phases have upward orientation, satisfy the analytic ordered-curvature
  contract, have at most 1e-6 normalized surface-equation error, zero hard-feature edges, two v1 components
  and regions, zero face-regime and boundary-mask error, exactly 24 boundary edges on the x=0 reference
  curve, at most 0.02 normalized boundary-distance upper bound, two endpoints, and no junction.
claim_boundary: This is non-claim-eligible scratch evidence for one deterministic R=1, L=2, 32-by-64 open-cylinder
  phase pair and one deterministic 24-by-48 paired-diagonal graph of q(x)=0.5(1+tanh(x/0.08)), using supplied
  analytic curvature, the shared boundary-disabled 45-degree classifier, and unchanged serial cpu_reference_v1
  comparisons. It establishes fixture and oracle integrity only; it makes no candidate A-D selection,
  v2 formulation, broad-corpus, held-out confirmation, convergence, remeshing-stability, performance,
  runtime/UI, Vulkan, GPU, or production claim.
evidence_phase: scratch
claim_eligible: false
datasets:
- id: cylinder-smooth-transition-paired-controls-v1
  path: benchmarks/runners/CurvatureSegmentationProfileRunner.cpp
  sha256: 0580b8d8a8fc6cf13144695ae48fd12487a0ea6542f185451dfc15bf516c6eb9
  split: scratch
