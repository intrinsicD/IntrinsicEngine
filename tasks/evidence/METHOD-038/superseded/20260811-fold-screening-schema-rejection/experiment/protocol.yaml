schema_version: 2
task_id: METHOD-038
protocol_id: curvature-segmentation-fold-controls-scratch-v1
profile: claim-grade
state: frozen
question: Does the deterministic paired-diagonal fold-control harness honor the frozen strict 45-degree
  feature threshold at 30, 45, and 60 degrees, preserve edge lengths under folding, and leave the constant-curvature
  cpu_reference_v1 payload unchanged from the flat control?
hypothesis: Both triangulations classify zero crease edges at 30 and 45 degrees and exactly 24 crease
  edges at 60 degrees, with zero edge-mask mismatch, at most 1e-6 bbox-normalized edge-length delta, three
  exercised variants, and for every variant one v1 component, one connected region, zero v1 boundary edges,
  and byte-equivalent published v1 payloads relative to its flat control.
claim_boundary: This is non-claim-eligible scratch evidence for one deterministic 24-by-48 analytic fold
  triplet, two diagonal patterns, one strict 45-degree classifier setting, and the serial cpu_reference_v1
  constant-curvature negative control. It establishes fixture and oracle integrity only; it makes no candidate
  A-D selection, v2 formulation, broad-corpus, confirmation, convergence, remeshing-stability, performance,
  runtime/UI, Vulkan, GPU, or production claim.
evidence_phase: scratch
claim_eligible: false
datasets:
- id: fold-threshold-triplet-paired-diagonals-v1
  path: benchmarks/runners/CurvatureSegmentationProfileRunner.cpp
  sha256: b84efe7fe1eb49cef8c4b0cdd2ff32d7860fc9f755cd7fa061637d685b667abe
  split: scratch
disjoint_splits: []
seeds:
- 1723
input_policy: Use only the committed 24-by-48 fold generator, diagonal_a and diagonal_b, dihedrals 30/45/60
  degrees, strict greater-than 45-degree threshold, boundary_is_feature false, constant supplied K1=1
  and K2=0, and fixed one-component cpu_reference_v1 parameters. Seed 1723 is retained as the declared
  screening-corpus custody identity even though this deterministic control consumes no random numbers.
  Preserve every observed failure; do not retune angles, threshold semantics, triangulations, mesh resolution,
  curvature values, fixture coordinates, or gates from this run.
comparators:
- id: diagonal-a-versus-diagonal-b
  budget: identical rows, columns, angles, classifier parameters, curvature descriptors, and serial CPU
    backend
- id: folded-versus-flat-v1-negative-control
  budget: identical topology, diagonal pattern, constant curvature descriptors, fixed-one parameters,
    and serial CPU backend
