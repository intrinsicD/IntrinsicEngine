screening_confirmation_policy: This scratch run may validate only the control fixture and measurement
  lane. It cannot select or reject candidate A-D and cannot authorize a scientific or production claim.
  Formal candidate screening and its disjoint held-out confirmation remain separate future frozen protocols
  using the corpus and seeds declared in feature_aligned_intake.md; no confirmation input may be inspected
  while adapting a screening candidate.
