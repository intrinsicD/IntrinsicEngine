  gpu: false
command:
- /bin/bash
- -o
- pipefail
- -c
- set -eu; CCACHE_DISABLE=1 cmake --build --preset ci --target IntrinsicCurvatureSegmentationProfile --parallel
  2; result_root=build/ci/custody/METHOD-038-scratch-004-raw; producer_status=0; env INTRINSIC_CURVATURE_PROFILE_COHORT=screening
  GIT_COMMIT=27b0c3e8825a7b48c01bf869377fcb791e2ef74a python3 tools/benchmark/run_and_seal.py --executable
  build/ci/bin/IntrinsicCurvatureSegmentationProfile --output "$result_root" --manifests-root benchmarks
  --run-id method-038-scratch-004 --attempt-id attempt-004 || producer_status=$?; test "$producer_status"
  -eq 0 -o "$producer_status" -eq 1; python3 tools/benchmark/validate_benchmark_results.py --root "$result_root"
  --manifests-root benchmarks --strict; input_root=tasks/evidence/METHOD-038/experiment/inputs; run_root=tasks/evidence/METHOD-038/experiment/runs/scratch-004;
  mkdir -p "$input_root"; cp "$result_root/geometry.curvature_segmentation.screening.fold_controls.json"
  "$input_root/fold_controls_benchmark_result.json"; jq -c --argjson expected '[0,0,24]' '{feature_mask_error:.metrics.quality_error_l2,isometry_error:.metrics.quality_error_linf,variant_population:.metrics.population_count,classified_count_error:([range(0;3)
  as $i | range(0;2) as $j | ((.diagnostics.variants[$i].classified_feature_edge_counts[$j] - $expected[$i])
  | if . < 0 then -. else . end)] | max),expected_count_error:([range(0;3) as $i | ((.diagnostics.variants[$i].expected_feature_edge_count
  - $expected[$i]) | if . < 0 then -. else . end)] | max),v1_component_deviation:([.diagnostics.variants[].v1_selected_component_count
  | ((. - 1) | if . < 0 then -. else . end)] | max),v1_region_deviation:([.diagnostics.variants[].v1_connected_region_count
  | ((. - 1) | if . < 0 then -. else . end)] | max),v1_boundary_count:([.diagnostics.variants[].v1_boundary_edge_count]
  | max),v1_flat_mismatch_count:([.diagnostics.variants[].v1_matches_flat_control | if . then 0 else 1
  end] | add),variant_failure_count:([.diagnostics.variants[].passed | if . then 0 else 1 end] | add),benchmark_failure_count:(if
  .execution_status == "passed" and .status == "passed" then 0 else 1 end)}' "$input_root/fold_controls_benchmark_result.json"
  > "$run_root/raw_rows.jsonl"; jq -e '.benchmark_id == "geometry.curvature_segmentation.screening.fold_controls"
  and .diagnostics.implementation_version == "slice_a_control_v1" and .diagnostics.candidate_selection
  == "none"' "$input_root/fold_controls_benchmark_result.json" >/dev/null
