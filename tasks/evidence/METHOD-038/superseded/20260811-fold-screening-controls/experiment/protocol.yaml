schema_version: 2
task_id: METHOD-038
protocol_id: curvature-segmentation-v1-fixtures-10k-scratch-v3
profile: claim-grade
state: frozen
question: On bounded 10k analytic fixtures, does cpu_reference_v1 preserve the preregistered Fixed component
  counts and continuous/label-error bounds across alternate triangulations in supplied, cold, and reusable-curvature
  lanes, and does Automatic recover the same planted component counts without retuning?
hypothesis: Fixed selects two components on both planar transition triangulations and one component on
  both unit-sphere triangulations in cold and reusable lanes, with maximum label error and normalized
  continuous-boundary error at most 0.02. Automatic recovers the same expected counts and label-error
  bound under the unchanged one-through-four candidate range.
claim_boundary: This is non-claim-eligible scratch evidence for one checked-in 10k planar transition pair
  and one 10k analytic unit-sphere diagonal pair on the serial cpu_reference_v1 backend. It makes no general
  remeshing-convergence, curved-surface geodesic-boundary, screening-corpus, acceleration, optimized-CPU,
  runtime/UI, Vulkan, GPU, or production-v2 claim.
evidence_phase: scratch
claim_eligible: false
datasets:
- id: curvature-transition-grid-pair-10k-v1
  path: benchmarks/runners/CurvatureSegmentationProfileRunner.cpp
  sha256: a98afaba7b0536e0ddf8773b96a728e1821551931181a019d698a198809bc0c0
  split: scratch
- id: unit-sphere-diagonal-pair-10k-v1
  path: benchmarks/runners/CurvatureSegmentationProfileRunner.cpp
  sha256: a98afaba7b0536e0ddf8773b96a728e1821551931181a019d698a198809bc0c0
  split: scratch
disjoint_splits: []
seeds:
- 17
input_policy: Use only the committed fixture cohort, the declared one/three warmup/measured schedule,
  seed 17, Fixed counts one and two, and the unchanged Automatic range one through four. Preserve failed
  population or quality gates; do not retune the selector, fixture, seed, descriptors, or thresholds from
  this replay.
comparators:
- id: fixed-versus-automatic
  budget: same fixture, warmup, measured iterations, and serial CPU backend
- id: cold-versus-reusable-curvature
  budget: same unit-sphere triangulations, parameters, seed, and CPU backend
primary_metrics:
- name: fixed_boundary_error
  direction: minimize
  unit: bbox-normalized-symmetric-surface-hausdorff-upper-bound
  statistical_unit: planar-transition-pair
- name: fixed_transition_population
  direction: target
  unit: selected-components
  statistical_unit: planar-transition-pair
- name: fixed_cold_population
  direction: target
  unit: selected-components
  statistical_unit: unit-sphere-diagonal-pair
- name: fixed_reuse_population
