  unit: selected-components
  statistical_unit: unit-sphere-diagonal-pair
- name: automatic_reuse_population
  direction: target
  unit: selected-components
  statistical_unit: unit-sphere-diagonal-pair
- name: automatic_max_label_error
  direction: minimize
  unit: maximum-misclassified-face-fraction
  statistical_unit: three-automatic-fixture-pairs
