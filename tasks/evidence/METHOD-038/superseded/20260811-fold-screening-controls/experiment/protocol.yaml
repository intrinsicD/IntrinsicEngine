screening_confirmation_policy: This replay is scratch-only and cannot select candidate A-D or authorize
  a scientific/production claim. Passing Fixed gates establishes only that the bounded fixture and measurement
  lane are usable. Any Automatic failure is retained as negative evidence. Formal screening still requires
  the disjoint analytic corpus and frozen candidate formulations declared by METHOD-038.
resources:
  cpu_threads: 1
  gpu: false
command:
- /bin/bash
- -o
- pipefail
- -c
- set -eu; CCACHE_DISABLE=1 cmake --build --preset ci --target IntrinsicCurvatureSegmentationProfile --parallel
  2; result_root=build/ci/custody/METHOD-038-scratch-003-raw; producer_status=0; env INTRINSIC_CURVATURE_PROFILE_COHORT=fixtures
  GIT_COMMIT=a944b1a1537ec9dc90ef2da75384f3ad515f0924 python3 tools/benchmark/run_and_seal.py --executable
  build/ci/bin/IntrinsicCurvatureSegmentationProfile --output "$result_root" --manifests-root benchmarks
  --run-id method-038-scratch-003 --attempt-id attempt-003 || producer_status=$?; test "$producer_status"
  -eq 1; python3 tools/benchmark/validate_benchmark_results.py --root "$result_root" --manifests-root
  benchmarks --strict; input_root=tasks/evidence/METHOD-038/experiment/inputs; run_root=tasks/evidence/METHOD-038/experiment/runs/scratch-003;
  mkdir -p "$input_root"; cp "$result_root/geometry.curvature_segmentation.reference.remeshing.10k.fixed.json"
  "$input_root/remeshing_fixed_benchmark_result.json"; cp "$result_root/geometry.curvature_segmentation.reference.remeshing.10k.automatic.json"
  "$input_root/remeshing_automatic_benchmark_result.json"; cp "$result_root/geometry.curvature_segmentation.reference.profile.10k.cold.fixed.json"
  "$input_root/cold_fixed_benchmark_result.json"; cp "$result_root/geometry.curvature_segmentation.reference.profile.10k.cold.automatic.json"
  "$input_root/cold_automatic_benchmark_result.json"; cp "$result_root/geometry.curvature_segmentation.reference.profile.10k.reuse.fixed.json"
  "$input_root/reuse_fixed_benchmark_result.json"; cp "$result_root/geometry.curvature_segmentation.reference.profile.10k.reuse.automatic.json"
  "$input_root/reuse_automatic_benchmark_result.json"; jq -n --slurpfile rf "$input_root/remeshing_fixed_benchmark_result.json"
  --slurpfile ra "$input_root/remeshing_automatic_benchmark_result.json" --slurpfile cf "$input_root/cold_fixed_benchmark_result.json"
  --slurpfile ca "$input_root/cold_automatic_benchmark_result.json" --slurpfile uf "$input_root/reuse_fixed_benchmark_result.json"
  --slurpfile ua "$input_root/reuse_automatic_benchmark_result.json" '{fixed_boundary_error:$rf[0].metrics.quality_error_linf,fixed_transition_population:$rf[0].metrics.population_count,fixed_cold_population:$cf[0].metrics.population_count,fixed_reuse_population:$uf[0].metrics.population_count,fixed_max_label_error:([$rf[0].metrics.quality_error_l2,$cf[0].metrics.quality_error_l2,$uf[0].metrics.quality_error_l2]|max),automatic_transition_population:$ra[0].metrics.population_count,automatic_cold_population:$ca[0].metrics.population_count,automatic_reuse_population:$ua[0].metrics.population_count,automatic_max_label_error:([$ra[0].metrics.quality_error_l2,$ca[0].metrics.quality_error_l2,$ua[0].metrics.quality_error_l2]|max)}'
  > "$run_root/raw_rows.jsonl"; jq -e '.execution_status == "passed" and .status == "passed"' "$input_root/remeshing_fixed_benchmark_result.json"
  "$input_root/cold_fixed_benchmark_result.json" "$input_root/reuse_fixed_benchmark_result.json" >/dev/null;
  jq -e '.execution_status == "failed" and .status == "failed"' "$input_root/remeshing_automatic_benchmark_result.json"
  "$input_root/cold_automatic_benchmark_result.json" "$input_root/reuse_automatic_benchmark_result.json"
  >/dev/null
