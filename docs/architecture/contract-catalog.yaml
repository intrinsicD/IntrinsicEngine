schema_version: 1
contracts:
  io.geometry-format-capabilities:
    owner: geometry-and-assets
    source: docs/architecture/assets.md
    applies_when:
      - Geometry format kinds, aliases, import/export domains or binary capabilities change.
      - Asset routing or runtime decoding for a geometry file format changes.
    proofs:
      - tests/contract/runtime/Test.AssetWorkflowModule.cpp
      - tests/unit/assets/Test.Asset.ImportRouter.cpp
      - tests/unit/geometry/Test.GeometryIO.cpp
  repo.task-contract-discovery:
    owner: agent-workflow
    source: docs/agent/task-format.md
    applies_when:
      - The task schema, a task template, or the task-authoring/review workflow is materially changed.
      - A reusable subsystem or cross-layer contract is introduced or changed.
    proofs:
      - tools/agents/validate_tasks.py
      - tests/regression/tooling/Test.ValidateTasks.py
  repo.agent-work-graph:
    owner: agent-workflow
    source: docs/agent/workflow-evidence.md
    applies_when:
      - The checked-in agent work-graph schema, topology recipe, state lifecycle, or CLI transitions are changed.
      - Agent execution ordering, write permissions, independent-review separation, retry budgets, or terminal source binding are changed.
    proofs:
      - tools/agents/agent_work_graph.py
      - tests/regression/tooling/Test.AgentWorkGraph.py
  repo.source-documentation:
    owner: agent-workflow
    source: docs/agent/source-documentation-policy.md
    applies_when:
      - A project-owned C++ module interface or header is created or materially changed.
      - Source comments or README files are added or materially changed.
      - A source-documentation audit or cleanup task is opened or reviewed.
    proofs:
      - tools/agents/skills/intrinsicengine-source-documentation/scripts/audit_source_documentation.py
      - tests/regression/tooling/Test.SourceDocumentationAudit.py
  graphics.recipe-slot-lookup:
    owner: graphics-renderer
    source: docs/architecture/frame-graph.md
    applies_when:
      - Config, frame projection or editor code locates a named render-recipe slot or borrows it for mutation.
    proofs:
      - src/graphics/renderer/Graphics.RenderingContract.cppm
      - src/graphics/renderer/Graphics.RenderingContract.cpp
      - tests/contract/graphics/Test.RenderRecipeConfig.cpp
  runtime.spatial-query-locality:
    owner: runtime-geometry
    source: docs/architecture/spatial-indices.md
    applies_when:
      - SpatialIndexCache's public module dependencies, GPU query integration or borrowed WorldRegistry declaration change.
    proofs:
      - tools/analysis/compile_hotspots.py
      - tests/CMakeLists.txt
      - tests/contract/runtime/Test.SpatialIndexCache.cpp
      - tests/integration/graphics/Test.PointLBVHGpuSmoke.cpp
  runtime.kernel-interface-locality:
    owner: runtime-core
    source: docs/architecture/runtime.md
    applies_when:
      - Kernel type identity, its shared hash implementation or command/event/service/job interface dependencies change.
      - Setup/frame-hook or input-action contexts' borrowed registry declarations change.
      - JobService's borrowed GPU command-context declaration or its sole owner definition changes.
    proofs:
      - tests/unit/core/Test.CoreHash.cpp
      - tests/unit/core/Test.CoreFrameGraph.cpp
      - tests/unit/core/Test.CoreFrameGraphTypeTokenHelper.cpp
      - tests/contract/runtime/Test.RuntimeJobService.cpp
      - tools/analysis/compile_hotspots.py
      - tests/CMakeLists.txt
  runtime.engine-compilation-locality:
    owner: runtime-build
    source: docs/architecture/runtime.md
    applies_when:
      - Engine's public module dependencies, borrowed renderer type or module-lifecycle declarations change.
    proofs:
      - tools/analysis/compile_hotspots.py
      - tests/regression/tooling/Test.CompileHotspots.py
      - tests/CMakeLists.txt
  runtime.render-diagnostics-locality:
    owner: runtime-build
    source: docs/architecture/runtime.md
    applies_when:
      - Render diagnostics or recipe-override records and their runtime/editor consumers change ownership or module dependencies.
    proofs:
      - tools/analysis/compile_hotspots.py
      - tests/regression/tooling/Test.CompileHotspots.py
      - tests/CMakeLists.txt
  runtime.editor-prepared-frame-locality:
    owner: runtime-editor
    source: docs/architecture/sandbox-editor-feature-boundaries.md
    applies_when:
      - Private editor attachment or processing-frame dependencies on workspace snapshot records change.
      - Processing-frame result bindings, cached execution contexts or their private compilation boundary change.
      - Reference-only snapshot borrows or their sole owning definitions change linkage or ownership.
      - Command-frame context conversions or their opaque return-type declarations change compilation ownership.
      - Scene or visualization action helper declarations and their workspace-binding dependencies change.
    proofs:
      - tests/contract/runtime/Test.SandboxEditorSessionLifecycle.cpp
      - tests/contract/runtime/Test.SandboxEditorModels.cpp
      - tools/analysis/compile_hotspots.py
      - tests/CMakeLists.txt
  runtime.texture-bake-interface-locality:
    owner: runtime-editor
    source: docs/architecture/runtime.md
    applies_when:
      - Texture-bake public interface dependencies or its private composition methods change.
      - Visualization and workspace interfaces acquire texture-bake implementation dependencies.
    proofs:
      - tests/contract/runtime/Test.TextureBakeModule.cpp
      - tests/integration/runtime/Test.RuntimeSandboxAcceptanceGpuSmoke.cpp
      - tools/analysis/compile_hotspots.py
      - tests/CMakeLists.txt
  runtime.processing-compilation-locality:
    owner: runtime-build
    source: docs/architecture/sandbox-editor-feature-boundaries.md
    applies_when:
      - Density/spacing contracts, shared processing execution or property capture, and their module dependencies change.
      - Another processing family is migrated to the compilation-locality boundary.
    proofs:
      - tools/analysis/compile_hotspots.py
      - tests/regression/tooling/Test.CompileHotspots.py
      - tests/CMakeLists.txt
  geometry.element-domain-sources:
    owner: ecs-geometry-runtime
    source: docs/architecture/geometry-api-style.md
    applies_when:
      - A method or operation consumes a typed property on vertices, halfedges, edges, or faces, or consumes adjacency between those domains, from an ECS geometry entity.
      - Method input eligibility, numeric shape conversion or property-name-independent binding changes.
      - Runtime or UI eligibility is selected from geometry provenance or element-domain availability.
      - Results are published back to an ECS geometry source or change its topology or cardinality.
    proofs:
      - tests/unit/ecs/Test.ECS.GeometrySourcesPopulate.cpp
      - tests/contract/runtime/Test.GeometryAvailability.cpp
      - tests/contract/runtime/Test.CurvatureSegmentationOperations.cpp
      - tests/contract/runtime/Test.MeshGeometryExtraction.cpp
      - tests/contract/runtime/Test.GraphGeometryExtraction.cpp
      - tests/contract/runtime/Test.PointCloudGeometryExtraction.cpp
      - tests/contract/runtime/Test.PointCloudConsolidationModule.cpp
  geometry.property-coherence:
    owner: geometry-runtime-graphics
    source: docs/architecture/property-coherence.md
    applies_when:
      - A canonical geometry property is introduced or changed so CPU mutation, GPU method execution, rendering, visualization, upload, readback, or residency observes its content.
      - A method publishes CPU or GPU results to geometry properties, or a renderer/compute consumer caches property-backed GPU data across boundaries.
      - Property mutation revisions, staging, transfer barriers, completion tokens, or CPU/GPU authority at method boundaries are changed.
    proofs:
      - tests/unit/geometry/Test.GeometryProperties.cpp
      - tests/contract/graphics/Test.GpuTransferFacade.cpp
      - tests/contract/graphics/Test.GpuWorldLifetimeContract.cpp
      - tests/contract/runtime/Test.MeshGeometryExtraction.cpp
      - tests/contract/runtime/Test.GraphGeometryExtraction.cpp
      - tests/contract/runtime/Test.PointCloudGeometryExtraction.cpp
      - tests/contract/runtime/Test.VisualizationRecipes.cpp
      - tests/integration/graphics/Test.GpuTransferFacadeGpuSmoke.cpp
      - tests/integration/runtime/Test.PointCloudConsolidationGpuParity.cpp
  geometry.parameterization-optimization:
    owner: geometry
    source: docs/architecture/parameterization-mapping-roadmap.md
    applies_when:
      - A parameterization method consumes or changes shared triangle reference frames, signed-SVD proper rotations, ARAP/SLIM proxies, symmetric-Dirichlet energy or gradients, or locally-injective step selection.
      - A new parameterization backend would otherwise reimplement the shared optimization numerics.
    proofs:
      - tests/unit/geometry/Test.ParameterizationOptimize.cpp
  geometry.support-radius-policy:
    owner: geometry-runtime
    source: docs/architecture/support-radius-policy.md
    applies_when:
      - A point-set method introduces or changes a world-unit support-radius default, sampled support occupancy estimate, or neighborhood-workload guard.
      - A runtime or backend consumes automatic versus manual support-radius intent for LOP, WLOP, CLOP, EAR, or a future compatible compact-support method.
    proofs:
      - tests/unit/geometry/Test.SupportRadius.cpp
      - tests/contract/runtime/Test.PointCloudConsolidationModule.cpp
      - tests/contract/runtime/Test.PointCloudConsolidationConfig.cpp
  method.engine-integration:
    owner: methods-runtime-app
    source: docs/architecture/method-api-contract.md
    applies_when:
      - A method package is created or materially changed.
      - A method is bound into RuntimeModule, config/agent controls, ECS publication, or Sandbox UI.
      - Method work defers an engine integration surface to a follow-up task.
    proofs:
      - tools/agents/validate_tasks.py
      - tests/regression/tooling/Test.ValidateTasks.py
      - tests/contract/runtime/Test.SandboxEditorMeshMethods.cpp
      - tests/contract/runtime/Test.SandboxEditorClusteringMethods.cpp
